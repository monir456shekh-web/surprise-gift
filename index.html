<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#211722">
<title>A Little Surprise For You</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(circle at top,#53364c,#211722 65%);color:#fff;font-family:system-ui,sans-serif}
main{width:min(100%,520px);text-align:center;background:#ffffff12;border:1px solid #ffffff30;border-radius:25px;padding:28px 20px;box-shadow:0 20px 60px #0005}
.gift{font-size:48px}
h1{font-size:27px;margin:10px 0;color:#ffe1ee}
.sub{color:#e8d4df;line-height:1.6}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #d7a8c2;background:#fff;color:#241722;font-size:16px;margin:12px 0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#f3bfd8;color:#321c2b;font-size:16px;font-weight:700}
#error{min-height:24px;color:#ffd0d0}
.hidden{display:none}
video{width:100%;border-radius:14px;margin-top:18px;background:#000}
.note{font-size:22px;color:#ffe1ee;font-weight:650;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="gift">🎁</div>
<h1>A Little Surprise For You</h1>
<p class="sub">একটা ছোট্ট সারপ্রাইজ তোমার জন্য ❤️<br>ভিডিওটি দেখতে পাসওয়ার্ড দাও।</p>
<section id="gate">
<input id="pw" type="password" placeholder="Enter password" autocomplete="off">
<button id="unlock">Unlock your surprise ❤️</button>
<p id="error" role="status"></p>
</section>
<section id="result" class="hidden">
<video id="vid" controls playsinline></video>
<p class="note">আসলেই তোমাকে শাড়ি খুব সুন্দর লাগছে..🫠</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
$('unlock').onclick=async()=>{
 const p=$('pw').value;
 if(!p){$('error').textContent='পাসওয়ার্ড লিখো।';return}
 $('unlock').disabled=true;
 $('error').textContent='ভিডিও খুলছে…';
 let url;
 try{
  const r=await fetch('./video.enc',{cache:'no-store'});
  if(!r.ok)throw Error();
  const data=new Uint8Array(await r.arrayBuffer());
  if(data.length<48||data[0]!==83||data[1]!==71||data[2]!==86||data[3]!==49)throw Error();
  const salt=data.slice(4,20),iv=data.slice(20,32),cipher=data.slice(32);
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);
  const blob=new Blob([plain],{type:'video/mp4'});
  url=URL.createObjectURL(blob);
  $('vid').src=url;
  $('gate').classList.add('hidden');
  $('result').classList.remove('hidden');
 }catch(e){
  $('error').textContent='পাসওয়ার্ড ভুল অথবা ভিডিও লোড হয়নি।';
  $('unlock').disabled=false;
 }
};
</script>
</body>
  </html>
